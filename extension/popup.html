<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PrivateSubs</title>
<style>
  :root { accent-color: #0d9488; }
  body { width: 320px; margin: 0; font: 13px/1.4 system-ui, Segoe UI, Roboto, sans-serif; color: #1d1d1f; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: #111; color: #fff; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  main { padding: 12px 14px; }
  .status { padding: 8px 10px; border-radius: 6px; background: #f2f2f4; margin-bottom: 12px; min-height: 18px; }
  .status.err { background: #fde8e8; color: #8a1c1c; }
  .bar { height: 4px; background: #ddd; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: #0d9488; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 12px; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > input[type=text], .row > select { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-weight: 400; }
  button { padding: 6px 10px; border: 1px solid #bbb; background: #fff; border-radius: 5px; font: inherit; cursor: pointer; }
  button.primary { background: #0d9488; border-color: #0d9488; color: #fff; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .hint { color: #666; font-size: 11px; margin-top: 4px; }
  #testOut { margin-top: 8px; font-size: 12px; color: #333; white-space: pre-wrap; }
  .switch { position: relative; width: 36px; height: 20px; }
  .switch input { display: none; }
  .switch span { position: absolute; inset: 0; background: #666; border-radius: 10px; cursor: pointer; transition: .15s; }
  .switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
  .switch input:checked + span { background: #0d9488; }
  .switch input:checked + span::after { left: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1 data-i18n="extName">PrivateSubs</h1>
  <label class="switch" data-i18n-title="popupToggleTitle"><input type="checkbox" id="enabled"><span></span></label>
</header>
<main>
  <div class="status" id="status">…</div>
  <button class="primary hidden" id="wizardBig" style="width:100%;margin-bottom:10px" data-i18n="btnWizardBig"></button>

  <label for="targetLang" data-i18n="lblTarget"></label>
  <select id="targetLang"></select>

  <label for="uiLang" data-i18n="lblUiLang"></label>
  <select id="uiLang"></select>

  <label for="ollamaUrl" data-i18n="lblOllamaUrl"></label>
  <input type="text" id="ollamaUrl" placeholder="http://127.0.0.1:11434">

  <label for="model" data-i18n="lblModel"></label>
  <div class="row">
    <select id="modelSelect"></select>
    <button id="refresh" data-i18n-title="btnRefreshModels">↻</button>
  </div>
  <input type="text" id="model" placeholder="translategemma:4b" style="margin-top:6px">
  <div class="hint" data-i18n="hintModel"></div>

  <label for="fontScale"><span data-i18n="lblFontSize"></span> <span id="fontScaleVal"></span></label>
  <input type="range" id="fontScale" min="0.6" max="1.8" step="0.05" style="width:100%">

  <label class="check"><input type="checkbox" id="showOriginal"> <span data-i18n="lblShowOriginal"></span></label>
  <label class="check"><input type="checkbox" id="autoTranslate"> <span data-i18n="lblAutoTranslate"></span></label>

  <label for="chunkSize" data-i18n="lblChunk"></label>
  <input type="text" id="chunkSize">

  <div class="actions">
    <button class="primary" id="save" data-i18n="btnSave"></button>
    <button id="test" data-i18n="btnTest"></button>
    <button id="retry" data-i18n="btnRetry"></button>
    <button id="clear" data-i18n="btnClearCache"></button>
    <button id="wizard" data-i18n="btnWizard"></button>
  </div>
  <div id="testOut"></div>
</main>
<script src="defaults.js"></script>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
