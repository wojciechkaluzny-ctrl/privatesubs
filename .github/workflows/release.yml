name: Release

# Two ways to publish a release:
#  - push a tag:   git tag v1.2.3 && git push --tags
#  - or click:     Actions → Release → Run workflow  (tag is created from the version in manifest.json)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Work out the version and check it
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          P=$(node -p "require('./package.json').version")
          test "$V" = "$P" || { echo "package.json version $P differs from manifest.json $V"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$V" = "$GITHUB_REF_NAME" || { echo "manifest.json version $V does not match tag $GITHUB_REF_NAME"; exit 1; }
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = this version's section of CHANGELOG.md
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          ZIP="dist/privatesubs-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "PrivateSubs $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "PrivateSubs $VERSION" --notes-file notes.md
          fi
